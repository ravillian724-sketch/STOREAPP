import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def googleMapsApiKey = (project.findProperty('GOOGLE_MAPS_API_KEY')
        ?: System.getenv('GOOGLE_MAPS_API_KEY')
        ?: '').toString()
def appApplicationId = (project.findProperty('APP_APPLICATION_ID')
        ?: System.getenv('APP_APPLICATION_ID')
        ?: 'com.Abdulah.ecommerce_app').toString()
def appDisplayName = (project.findProperty('APP_DISPLAY_NAME')
        ?: System.getenv('APP_DISPLAY_NAME')
        ?: 'STOREAPP').toString()
def isReleaseTask = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

android {
    namespace = "com.Abdulah.ecommerce_app"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = appApplicationId
        minSdkVersion = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [
            applicationName: "android.app.Application",
            googleMapsApiKey: googleMapsApiKey,
            appDisplayName: appDisplayName,
            usesCleartextTraffic: "true",
        ]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders.usesCleartextTraffic = "true"
        }

        release {
            manifestPlaceholders.usesCleartextTraffic = "false"
            signingConfig = signingConfigs.release

            if (isReleaseTask) {
                if (googleMapsApiKey.trim().isEmpty()) {
                    throw new GradleException(
                        'GOOGLE_MAPS_API_KEY is required for release builds.'
                    )
                }
                if (!keystorePropertiesFile.exists()) {
                    throw new GradleException(
                        'android/key.properties is required for release signing.'
                    )
                }
                if (appApplicationId == 'com.Abdulah.ecommerce_app') {
                    throw new GradleException(
                        'APP_APPLICATION_ID must be set to the production package id.'
                    )
                }
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation platform('com.google.firebase:firebase-bom:33.14.0')
    implementation 'com.google.firebase:firebase-analytics'
}
